<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>FAQ</title>
<style>
  :root {
    --nero: #000;
    --grigio: #53565a;
    --verde-scuro: #046a38;
    --font-titoli: "Aptos Light", Aptos, "Segoe UI Light", "Segoe UI", Calibri, Arial, sans-serif;
    --font-testo: Aptos, "Segoe UI", Calibri, Arial, sans-serif;
    --larghezza: 1200px;
    --margine: 32px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }
  body { margin: 0; background: #fff; color: var(--nero); font: 16px/1.6 var(--font-testo); }
  button, input { font: inherit; color: inherit; }
  img { display: block; }
  :focus-visible { outline: 2px solid var(--nero); outline-offset: 2px; }

  .contenitore { max-width: var(--larghezza); margin: 0 auto; padding-left: var(--margine); padding-right: var(--margine); }

  .testata { background: var(--nero); color: #fff; }
  .testata .contenitore { display: flow-root; padding-bottom: 108px; }
  .testata-logo { height: 72px; display: flex; align-items: center; }
  .logo { height: 24px; width: auto; }
  .testata h1 { margin: 40px 0 0; font-family: var(--font-titoli); font-size: 44px; font-weight: 300; line-height: 1.1; }

  .accesso, .avviso { max-width: 420px; margin: 0; padding-top: 40px; }
  .riga { display: flex; }
  .riga input {
    flex: 1; min-width: 0; height: 48px; margin: 0; padding: 0 12px;
    border: 1px solid var(--grigio); border-radius: 0; background: #fff;
    outline: none; -webkit-appearance: none; appearance: none;
  }
  .riga input::placeholder { color: var(--grigio); opacity: 1; }
  .riga input:focus { border-color: var(--verde-scuro); box-shadow: inset 0 0 0 1px var(--verde-scuro); }
  .riga button { height: 48px; margin: 0; padding: 0 24px; border: 0; border-radius: 0; background: var(--verde-scuro); color: #fff; cursor: pointer; }
  .riga button:disabled { opacity: .6; cursor: default; }
  .errore { margin: 8px 0 0; }
  .ricorda { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; cursor: pointer; }
  .ricorda input { width: 18px; height: 18px; margin: 0; accent-color: var(--verde-scuro); cursor: pointer; }

  @media (max-width: 860px) {
    :root { --margine: 16px; }
    .testata .contenitore { padding-bottom: 92px; }
    .testata-logo { height: 56px; }
    .logo { height: 20px; }
    .testata h1 { margin-top: 24px; font-size: 32px; }
    .accesso, .avviso { padding-top: 24px; }
  }
</style>
</head>
